apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-frame-config
  namespace: agent-frame
data:
  NODE_ENV: production
  PORT: "3099"
  WEB_ORIGIN: http://localhost
  REDIS_URL: redis://redis:6379
  MAX_CONCURRENT_RUNS: "5"
  RUN_TIMEOUT_MS: "120000"
  MAX_AGENT_CALLS_PER_RUN: "8"
  MAX_A2A_DEPTH: "3"
  DEFAULT_A2A_TIMEOUT_MS: "30000"
  LOG_LEVEL: info
  LOG_EVENT_DELTA: "false"
