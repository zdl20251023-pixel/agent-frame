# Copy this file to secret.yaml and replace every placeholder before deployment.
# secret.yaml is ignored by Git; do not deploy this example file.
apiVersion: v1
kind: Secret
metadata:
  name: agent-frame-secrets
  namespace: agent-frame
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: change-this-root-password
  MYSQL_DATABASE: agent_frame
  MYSQL_USER: agentframe
  MYSQL_PASSWORD: change-this-database-password
  DATABASE_URL: mysql://agentframe:change-this-database-password@mysql:3306/agent_frame
  JWT_SECRET: replace-with-a-long-random-secret
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  DEEPSEEK_API_KEY: ""
  GOOGLE_GENERATIVE_AI_API_KEY: ""
