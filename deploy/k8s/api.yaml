apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-frame-api
  namespace: agent-frame
  labels:
    app.kubernetes.io/name: agent-frame-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-frame-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-frame-api
    spec:
      containers:
        - name: api
          image: agent-frame-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3099
          envFrom:
            - configMapRef:
                name: agent-frame-config
            - secretRef:
                name: agent-frame-secrets
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: agent-frame-api
  namespace: agent-frame
spec:
  selector:
    app.kubernetes.io/name: agent-frame-api
  ports:
    - name: http
      port: 3099
      targetPort: http
