apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-frame-web
  namespace: agent-frame
  labels:
    app.kubernetes.io/name: agent-frame-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-frame-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-frame-web
    spec:
      containers:
        - name: web
          image: agent-frame-web:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health.txt
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health.txt
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agent-frame-web
  namespace: agent-frame
spec:
  selector:
    app.kubernetes.io/name: agent-frame-web
  ports:
    - name: http
      port: 80
      targetPort: http
